<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine 💘</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

    /* ---------- RESPONSIVE FIXES ---------- */

/* Make text scale smoothly */
h2{
  font-size: clamp(22px, 4vw, 28px);
}

.emoji{
  font-size: clamp(52px, 10vw, 68px);
}

/* Card padding adapts */
.card{
  padding: clamp(28px, 5vw, 40px) clamp(20px, 5vw, 30px);
}

/* Buttons container adapts height */
.buttons{
  height: clamp(90px, 20vw, 120px);
}

/* Buttons scale on small screens */
button{
  padding: clamp(12px, 3vw, 14px) clamp(24px, 6vw, 36px);
  font-size: clamp(14px, 3.5vw, 16px);
}

/* Popup adapts */
.popup{
  width: min(90%, 320px);
  padding: clamp(20px, 5vw, 26px);
}

/* Prevent overflow on tiny screens */
@media (max-width: 360px){
  .hint{
    font-size: 12px;
  }
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(-45deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
  background-size:400% 400%;
  animation:bgMove 12s ease infinite;
  font-family:"Poppins",sans-serif;
  overflow:hidden;
}

@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* CARD */
.card{
  width:min(92%,420px);
  padding:40px 30px 45px;
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(18px);
  border-radius:28px;
  text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.25);
  position:relative;
  animation:cardIn 1.1s ease;
}

@keyframes cardIn{
  from{opacity:0;transform:translateY(30px) scale(.95)}
  to{opacity:1;transform:none}
}

/* CARD GLOW RING */
.card::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:30px;
  background:linear-gradient(120deg,#ff4d6d,#ff9a9e,#fbc2eb);
  filter:blur(20px);
  z-index:-1;
  opacity:.7;
}

.emoji{
  font-size:68px;
  margin-bottom:12px;
  animation:heartbeat 1.8s infinite;
}

@keyframes heartbeat{
  0%,100%{transform:scale(1)}
  25%{transform:scale(1.08)}
  75%{transform:scale(1.12)}
}

h2{
  font-family:"Playfair Display",serif;
  font-size:28px;
  color:#4a1c2f;
  margin-bottom:30px;
}

.buttons{
  position:relative;
  height:78px;
}

button{
  position:absolute;
  padding:14px 36px;
  border-radius:40px;
  border:none;
  font-size:16px;
  cursor:pointer;
  transition:.25s;
  box-shadow:0 10px 25px rgba(0,0,0,.15);
}

#yes{
  left:12%;
  background:linear-gradient(135deg,#ff4d6d,#ff758f);
  color:#fff;
}

#no{
  left:55%;
  background:rgba(255,255,255,.9);
  color:#777;
}

.hint{
  margin-top:26px;
  font-size:13px;
  color:#6b6b6b;
  font-style:italic;
}

/* POPUP (INSIDE CARD, NO BG CHANGE) */
.popup-overlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:5;
}

.popup{
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(14px);
  padding:26px;
  width:min(90%,300px);
  border-radius:22px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
  animation:popIn .35s ease;
}

@keyframes popIn{
  from{transform:scale(.85);opacity:0}
  to{transform:scale(1);opacity:1}
}

.popup h3{
  font-family:"Playfair Display",serif;
  color:#ff4d6d;
  margin-bottom:10px;
}

.popup p{
  font-size:15px;
  color:#555;
  margin-bottom:18px;
}

.popup button{
  position:static;
  background:linear-gradient(135deg,#ff4d6d,#ff758f);
  color:#fff;
  padding:10px 26px;
  border-radius:30px;
  border:none;
  cursor:pointer;
}

/* FLOATING HEARTS */
.heart{
  position:absolute;
  bottom:-20px;
  animation:floatUp linear forwards;
  pointer-events:none;
}

@keyframes floatUp{
  to{transform:translateY(-120vh);opacity:0}
}
</style>
</head>

<body>

<div class="card">
  <div class="emoji">🐱❤️</div>
  <h2>Will you be my Valentine?</h2>

  <div class="buttons">
    <button id="yes">Yes 💖</button>
    <button id="no">No 🙈</button>
  </div>

  <div class="hint">Some love stories don’t allow “no” ✨</div>

  <!-- POPUP INSIDE BOX -->
  <div id="yesPopup" class="popup-overlay">
    <div class="popup">
      <h3>💖 Yay!</h3>
      <p>I can’t wait for Valentine’s Day with you!</p>
      <button id="closePopup">Okay 💕</button>
    </div>
  </div>
</div>

<audio id="hoverSound" src="https://assets.mixkit.co/sfx/preview/mixkit-cartoon-voice-laugh-343.mp3"></audio>
<audio id="yesSound" src="https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.mp3"></audio>

<script>
const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");
const hoverSound=document.getElementById("hoverSound");
const yesSound=document.getElementById("yesSound");

const noTexts=["Are you sure? 😳","Think again 💭","Please 🥺","You can’t 😅","Nice try 😜","Almost 😏","Just say Yes 💖"];
let i=0;


let leftStart = 40;
const WINDOW_WIDTH = 260;
const SHIFT_BY = 10;
const SAFE_MARGIN = 20;
   // how much left edge moves

function moveNoButton() {
  hoverSound.currentTime = 0;
  hoverSound.play();

  const bRect = noBtn.getBoundingClientRect();

  const vw = document.documentElement.clientWidth;
  const vh = document.documentElement.clientHeight;

  const topPadding = 40;
  const bottomPadding = 40;

  // 🔒 ABSOLUTE MAX LEFT POSITION
  const maxLeftStart =
    vw - WINDOW_WIDTH - bRect.width - SAFE_MARGIN;

  // 🚑 STOP shrinking when limit reached
  if (leftStart > maxLeftStart) {
    leftStart = maxLeftStart;
  }

  // Define movement window
  let minX = leftStart;
  let maxX = leftStart + WINDOW_WIDTH;

  let minY = topPadding;
  let maxY = vh - bRect.height - bottomPadding;

  // 🚑 HARD FAILSAFE (last guard)
  minX = Math.max(SAFE_MARGIN, minX);
  maxX = Math.min(vw - bRect.width - SAFE_MARGIN, maxX);

  minY = Math.max(SAFE_MARGIN, minY);
  maxY = Math.min(vh - bRect.height - SAFE_MARGIN, maxY);

  // If area collapses, lock position safely
  if (maxX <= minX) maxX = minX + 1;
  if (maxY <= minY) maxY = minY + 1;

  const x = Math.random() * (maxX - minX) + minX;
  const y = Math.random() * (maxY - minY) + minY;

  noBtn.style.position = "fixed";
  noBtn.style.left = `${x}px`;
  noBtn.style.top = `${y}px`;

  noBtn.textContent = noTexts[i];
  i = (i + 1) % noTexts.length;

  // Slide window
  leftStart += SHIFT_BY;
}





/* Desktop */
noBtn.addEventListener("mouseover", moveNoButton);

/* Mobile */
noBtn.addEventListener("touchstart", moveNoButton);


yesBtn.addEventListener("click",()=>{
  yesSound.play();
  confetti({particleCount:260,spread:120,origin:{y:.65}});
  document.getElementById("yesPopup").style.display="flex";
});

document.getElementById("closePopup").onclick=()=>{
  document.getElementById("yesPopup").style.display="none";
};

function createHeart(){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML=Math.random()>.5?"❤️":"💗";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=Math.random()*22+14+"px";
  h.style.animationDuration=Math.random()*3+4+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),8000);
}
setInterval(createHeart,380);
</script>

</body>
</html>
